spring:
  application:
    name: movie-booking

  profiles:
    active: local

  # JPA / Hibernate
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Virtual threads (Java 21) — makes Tomcat use VirtualThread per request
  threads:
    virtual:
      enabled: true

  # Spring AI — Groq via OpenAI-compatible endpoint + MCP server
  # MCP Server (SSE transport):
  #   GET  /mcp/sse      — client opens a persistent SSE stream
  #   POST /mcp/messages — client sends tool call requests
  ai:
    openai:
      api-key: ${GROQ_API_KEY:missing}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama3-groq-70b-8192-tool-use-preview
          # Keep temperature low — tool calling requires deterministic JSON output.
          temperature: 0.1
    mcp:
      server:
        name: movie-booking-mcp-server
        version: "1.0.0"

# Actuator — health + info only in prod
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}

logging:
  level:
    com.moviebooking: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
